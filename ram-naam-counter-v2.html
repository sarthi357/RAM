<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ram Naam Jap Counter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕉️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff3dc;--bg2:#ffd9a0;--ink:#3b1d0a;--muted:#8a5a34;--card:rgba(255,252,246,.8);--acc:#e8730c;--deep:#b8430a;--gold:#f2b632;--line:rgba(184,67,10,.18);--track:rgba(184,67,10,.14);--b1:#ffc26b;--b2:#e8730c;--b3:#b8430a;--bt:#fff;--onacc:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body[data-mode=photo]{--bg1:#eef4ff;--bg2:#b9d3ff;--ink:#12264a;--muted:#48618f;--card:rgba(250,252,255,.8);--acc:#3b6fe0;--deep:#1f4bb0;--gold:#f2b632;--line:rgba(31,75,176,.2);--track:rgba(31,75,176,.14)}
body[data-mode=mala]{--bg1:#f1f8e7;--bg2:#cbe5a3;--ink:#1f3312;--muted:#56703a;--card:rgba(252,255,246,.8);--acc:#5b8c2a;--deep:#2f5d1a;--gold:#d4a72c;--line:rgba(47,93,26,.22);--track:rgba(47,93,26,.14);--b1:#b5dc7a;--b2:#5b8c2a;--b3:#2f5d1a}
body[data-mode=diya]{--bg1:#0d0a1f;--bg2:#2b1650;--ink:#ffeccc;--muted:#c9b0e8;--card:rgba(40,22,78,.7);--acc:#ffb02e;--deep:#ffc65c;--gold:#ffd98a;--line:rgba(255,198,92,.25);--track:rgba(255,198,92,.16);--onacc:#2a1400}
body[data-mode=lotus]{--bg1:#fff0f6;--bg2:#ffc4da;--ink:#4a1230;--muted:#9a4a72;--card:rgba(255,250,252,.8);--acc:#e0508a;--deep:#a8215c;--gold:#f2b632;--line:rgba(168,33,92,.2);--track:rgba(168,33,92,.14)}
body[data-mode=zen]{--bg1:#050505;--bg2:#181512;--ink:#f2efe9;--muted:#9a948a;--card:rgba(255,255,255,.06);--acc:#e8c27a;--deep:#f0d9a8;--gold:#e8c27a;--line:rgba(255,255,255,.14);--track:rgba(255,255,255,.1);--onacc:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Mukta',system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg1) 65%) fixed;overflow-x:hidden}
body[data-mode=diya]::before,body[data-mode=zen]::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.8;animation:tw 4s ease-in-out infinite alternate;
 background:radial-gradient(1.5px 1.5px at 10% 18%,#fff,transparent),radial-gradient(1px 1px at 24% 62%,#fff,transparent),radial-gradient(2px 2px at 38% 30%,#ffe9b0,transparent),radial-gradient(1px 1px at 52% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 66% 12%,#fff,transparent),radial-gradient(1px 1px at 78% 55%,#ffe9b0,transparent),radial-gradient(2px 2px at 90% 35%,#fff,transparent),radial-gradient(1px 1px at 6% 88%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 90%,#fff,transparent)}
@keyframes tw{from{opacity:.35}to{opacity:.9}}
.wrap{position:relative;max-width:520px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-family:'Tiro Devanagari Hindi',serif;font-weight:400;font-size:1.55rem;color:var(--deep)}
h1 small{display:block;font-family:'Mukta',sans-serif;font-size:.8rem;color:var(--muted)}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.15rem;cursor:pointer}
:is(.ib,.tap,.btn,.chip,select,input):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.modes{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--onacc);border-color:transparent;font-weight:600}
.stage{position:relative;margin:16px auto 6px;width:min(84vw,340px);aspect-ratio:1}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .t{stroke:var(--track)}
.ring .p{stroke:var(--acc);transition:stroke-dashoffset .25s ease}
body[data-mode=mala] .ring{display:none}
#beads{position:absolute;inset:0;display:none;pointer-events:none}
body[data-mode=mala] #beads{display:block}
.bd{position:absolute;left:50%;top:50%;border-radius:50%;background:var(--track);border:1px solid var(--line)}
.bd.on{background:radial-gradient(circle at 35% 30%,#fff5c2,var(--gold));box-shadow:0 0 7px var(--gold);border-color:transparent}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.vh.over{left:8%;top:8%;width:84%;height:84%;border-radius:50%;cursor:pointer;pointer-events:auto;z-index:5}
.tap{position:absolute;inset:8%;border-radius:50%;border:0;cursor:pointer;color:var(--bt);overflow:hidden;
 background:radial-gradient(circle at 35% 25%,var(--b1),var(--b2) 55%,var(--b3));
 box-shadow:0 14px 34px color-mix(in srgb,var(--b3) 45%,transparent),inset 0 -8px 20px rgba(0,0,0,.18),inset 0 6px 14px rgba(255,255,255,.35);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .09s ease;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tap.down{transform:scale(.95)}
body[data-mode=mala] .tap{inset:17%}
.tap.photo{background-size:cover;background-position:center;border:6px solid var(--gold);box-shadow:0 0 0 5px var(--card),0 18px 44px rgba(0,0,0,.35)}
.tap.diya,.tap.lotus,.tap.zen{background:none;box-shadow:none;color:var(--ink);overflow:visible}
.tap.zen{border:1px solid var(--line)}
.tap .ram{font-family:'Tiro Devanagari Hindi',serif;font-size:clamp(3rem,17vw,4.6rem);line-height:1;text-shadow:0 3px 8px rgba(0,0,0,.25)}
.tap.mala .ram{font-size:clamp(2.4rem,13vw,3.6rem)}
.tap.zen .ram{font-size:1.4rem;opacity:.5;text-shadow:none}
.num{font-size:clamp(1.5rem,8vw,2.1rem);font-weight:600;font-variant-numeric:tabular-nums}
.tap.zen .num{font-size:clamp(3rem,16vw,4.6rem);font-weight:400}
.hint{font-size:.78rem;opacity:.85}
.art{width:86%;pointer-events:none;overflow:visible}
.tap.diya .num,.tap.lotus .num{margin-top:-6px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.badge{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);padding:4px 14px;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.flick{transform-origin:100px 116px;animation:fk 1.4s ease-in-out infinite alternate}
@keyframes fk{from{transform:scale(1,1) rotate(-1.5deg)}to{transform:scale(.95,1.06) rotate(1.5deg)}}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.float{position:absolute;font-family:'Tiro Devanagari Hindi',serif;color:var(--deep);pointer-events:none;font-size:1.5rem;animation:fl 1.1s ease-out forwards;z-index:3}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-100px) scale(1.3)}}
.mantra{text-align:center;color:var(--muted);margin:8px 0 12px;font-family:'Tiro Devanagari Hindi',serif;font-size:1.05rem}
.row{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.btn{flex:1;max-width:160px;padding:11px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:transparent}
.btn.on{background:var(--deep);color:var(--bg1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px;backdrop-filter:blur(8px)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:1.25rem;color:var(--deep);font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted)}
.bar{height:10px;border-radius:9px;background:var(--track);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--acc));transition:width .3s}
.gl{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
h2{margin:0 0 8px;font-size:1rem;color:var(--deep)}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.7rem;color:var(--muted);gap:3px}
.col i{width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(var(--gold),var(--acc));min-height:3px}
.col.today i{background:linear-gradient(var(--acc),var(--deep))}
#panel{display:none}#panel.open{display:block}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
select,input[type=number]{font:inherit;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:110px}
.sw{position:relative;width:48px;height:28px;border-radius:20px;background:var(--track);border:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true]::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--deep);color:var(--bg1);padding:12px 20px;border-radius:30px;transition:.35s;z-index:9;text-align:center;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.petal{position:fixed;top:-30px;pointer-events:none;z-index:8;animation:pt linear forwards}
@keyframes pt{to{transform:translateY(110vh) rotate(360deg)}}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-mode="classic">
<div class="wrap">
  <header>
    <h1>राम नाम जप<small>Ram Naam Jap Counter</small></h1>
    <button class="ib" id="setBtn" aria-label="Settings">⚙️</button>
  </header>
  <div class="modes" id="modes" role="tablist" aria-label="Modes"></div>

  <div class="stage">
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="t" cx="60" cy="60" r="55"/>
      <circle class="p" id="prog" cx="60" cy="60" r="55" stroke-dasharray="345.58" stroke-dashoffset="345.58"/>
    </svg>
    <div id="beads"></div>
    <button class="tap" id="tap" aria-label="Chant Ram, add one count"></button>
  </div>
  <div class="mantra">॥ श्री राम जय राम जय जय राम ॥</div>

  <div class="row" id="photoRow" style="display:none">
    <button class="btn" id="chg">🖼 Change photo</button>
    <button class="btn" id="rmv">Remove photo</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <div class="row">
    <button class="btn" id="undo">↩ Undo</button>
    <button class="btn pri" id="auto">▶ Auto Jap</button>
    <button class="btn" id="reset">Reset today</button>
  </div>

  <div class="card"><div class="stats">
    <div><b id="sToday">0</b><span>Today</span></div>
    <div><b id="sTotal">0</b><span>All time</span></div>
    <div><b id="sMala">0</b><span>Malas</span></div>
    <div><b id="sStreak">0</b><span>Day streak</span></div>
  </div></div>

  <div class="card"><h2>Daily goal</h2>
    <div class="bar"><i id="goalBar"></i></div>
    <div class="gl"><span id="goalTxt">0 / 1008</span><span id="goalPct">0%</span></div></div>

  <div class="card"><h2>Last 7 days</h2><div class="week" id="week"></div></div>

  <div class="card" id="panel">
    <h2>Settings</h2>
    <div class="set"><span>Mala size</span><select id="malaSel"><option value="27">27 beads</option><option value="54">54 beads</option><option value="108">108 beads</option></select></div>
    <div class="set"><span>Daily goal</span><input type="number" id="goalIn" min="1" max="1000000"></div>
    <div class="set"><span>Bell &amp; tick sound</span><button class="sw" id="swSound" role="switch" aria-checked="true" aria-label="Sound"></button></div>
    <div class="set"><span>Vibration</span><button class="sw" id="swVib" role="switch" aria-checked="true" aria-label="Vibration"></button></div>
    <div class="set"><span>Auto Jap speed</span><select id="speedSel"><option value="1500">Slow</option><option value="1000">Medium</option><option value="600">Fast</option></select></div>
    <div class="set"><span>All-time data</span><button class="btn" id="wipe" style="max-width:130px">Erase all</button></div>
  </div>
  <footer>Progress saves on this device automatically.</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY='ramNaamJapV1',PK='ramNaamPhotoV1';
  const $=id=>document.getElementById(id);
  const today=()=>new Date().toLocaleDateString('en-CA');
  const dayKey=o=>{const d=new Date();d.setDate(d.getDate()-o);return d.toLocaleDateString('en-CA')};
  const fmt=n=>n.toLocaleString('en-IN');
  let S={total:0,days:{},mala:108,goal:1008,sound:true,vib:true,speed:1000,mode:'classic'};
  let photo=null;
  try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));photo=localStorage.getItem(PK)}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
  const MODES={classic:'🕉️ Classic',photo:'🖼 Photo',mala:'📿 Mala',diya:'🪔 Diya',lotus:'🪷 Lotus',zen:'🌙 Zen'};
  if(!MODES[S.mode])S.mode='classic';

  // audio
  let ac=null;
  function tone(f,d,v,t){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
  const tick=()=>{if(S.sound)tone(520,.09,.07,'triangle')};
  const bell=()=>{if(S.sound){tone(880,1.6,.16);tone(1320,1.2,.08);tone(440,1.8,.1)}};
  const vib=p=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

  // art per mode
  const DIYA='<svg class="art" viewBox="0 0 200 200"><defs><radialGradient id="gl"><stop offset="0" stop-color="#ffd166" stop-opacity=".85"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient><linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a18"/><stop offset="1" stop-color="#fff1a8"/></linearGradient></defs><circle id="glow" cx="100" cy="90" r="88" fill="url(#gl)"/><g id="flame"><g class="flick"><path d="M100 26C120 60 134 80 100 116C66 80 80 60 100 26Z" fill="url(#fl)"/><path d="M100 64C110 82 114 92 100 108C86 92 90 82 100 64Z" fill="#fff6c9"/></g></g><rect x="94" y="112" width="12" height="16" rx="5" fill="#3a2010"/><path d="M36 124H164C160 164 132 184 100 184C68 184 40 164 36 124Z" fill="#b5541a"/><path d="M36 124H164C162 134 158 140 154 146H46C42 140 38 134 36 124Z" fill="#e58a2d"/></svg><span class="num" id="bead"></span>';
  function lotus(){let p='';[-72,72,-48,48,-24,24,0].forEach(a=>{p+='<ellipse class="pt" data-a="'+a+'" cx="100" cy="98" rx="18" ry="52" fill="url(#lp)" stroke="#fff" stroke-opacity=".7" stroke-width="1.5" transform="rotate('+a+' 100 150)"/>'});
    return '<svg class="art" viewBox="0 0 200 200"><defs><linearGradient id="lp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e0508a"/><stop offset="1" stop-color="#ffd6e6"/></linearGradient></defs><ellipse cx="100" cy="170" rx="74" ry="14" fill="#2f7d4a" opacity=".45"/>'+p+'<circle cx="100" cy="128" r="9" fill="#f2b632"/></svg><span class="num" id="bead"></span>'}

  function build(){
    const t=$('tap'),m=S.mode;t.className='tap '+m;t.style.backgroundImage='';
    let h='';
    if(m==='classic'||m==='mala')h='<span class="ram">राम</span><span class="num" id="bead"></span><span class="hint">Tap or press Space</span>';
    else if(m==='photo'){if(photo){t.style.backgroundImage='url("'+photo+'")';h='<span class="badge" id="bead"></span>'}
      else h='<span class="ram">🖼️</span><span class="hint">Tap to add your photo</span>'}
    else if(m==='diya')h=DIYA;else if(m==='lotus')h=lotus();
    else h='<span class="ram">राम</span><span class="num" id="bead"></span>';
    t.innerHTML=h;
    $('photoRow').style.display=(m==='photo'&&photo)?'flex':'none';
    beads();render();
  }
  function beads(){const B=$('beads');B.innerHTML='';if(S.mode!=='mala')return;
    const r=B.clientWidth*.46,n=S.mala,sz=Math.min(16,2*Math.PI*r/n*.72);
    for(let i=0;i<n;i++){const d=document.createElement('i');d.className='bd';const a=i/n*2*Math.PI-Math.PI/2;
      d.style.cssText='width:'+sz+'px;height:'+sz+'px;transform:translate('+(Math.cos(a)*r-sz/2)+'px,'+(Math.sin(a)*r-sz/2)+'px)';B.appendChild(d)}}
  function setMode(m){S.mode=m;save();document.body.dataset.mode=m;
    document.querySelectorAll('.chip').forEach(c=>{c.classList.toggle('on',c.dataset.m===m);c.setAttribute('aria-selected',c.dataset.m===m)});build()}
  Object.keys(MODES).forEach(k=>{const b=document.createElement('button');b.className='chip';b.dataset.m=k;b.setAttribute('role','tab');b.textContent=MODES[k];b.onclick=()=>setMode(k);$('modes').appendChild(b)});

  // render
  const C=2*Math.PI*55;
  function streak(){let s=0,o=S.days[dayKey(0)]>0?0:1;while(S.days[dayKey(o)]>0){s++;o++}return s}
  function render(){
    const t=S.days[today()]||0,im=S.total%S.mala,p=im/S.mala;
    const b=$('bead');if(b)b.textContent=S.mode==='zen'?fmt(t):im+' / '+S.mala;
    $('prog').style.strokeDashoffset=C*(1-p);
    const f=$('flame');if(f){f.style.transformOrigin='100px 116px';f.style.transform='scale('+(.7+.55*p)+')';$('glow').style.opacity=.35+.65*p}
    document.querySelectorAll('.pt').forEach(e=>e.setAttribute('transform','rotate('+(e.dataset.a*(.3+.7*p))+' 100 150)'));
    [...$('beads').children].forEach((d,i)=>d.classList.toggle('on',i<im));
    $('sToday').textContent=fmt(t);$('sTotal').textContent=fmt(S.total);
    $('sMala').textContent=fmt(Math.floor(S.total/S.mala));$('sStreak').textContent=streak();
    const pct=Math.min(100,Math.round(t/S.goal*100));
    $('goalBar').style.width=pct+'%';$('goalTxt').textContent=fmt(t)+' / '+fmt(S.goal);$('goalPct').textContent=pct+'%';
    const w=$('week');w.innerHTML='';const vals=[];for(let i=6;i>=0;i--)vals.push([dayKey(i),S.days[dayKey(i)]||0]);
    const mx=Math.max(1,...vals.map(v=>v[1]));
    vals.forEach(([k,v],i)=>{const d=new Date(k+'T00:00:00'),c=document.createElement('div');c.className='col'+(i===6?' today':'');
      c.innerHTML='<span>'+(v?fmt(v):'')+'</span><i style="height:'+Math.max(3,v/mx*70)+'px"></i><span>'+d.toLocaleDateString('en',{weekday:'short'})+'</span>';w.appendChild(c)});
    document.title=(t?fmt(t)+' · ':'')+'Ram Naam Jap Counter';
  }
  let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2800)}
  function petals(){for(let i=0;i<22;i++){const p=document.createElement('div');p.className='petal';p.textContent=['🌼','🪷','🌸'][i%3];
    p.style.left=Math.random()*100+'vw';p.style.fontSize=(16+Math.random()*16)+'px';p.style.animationDuration=(2.5+Math.random()*2.5)+'s';p.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(p);setTimeout(()=>p.remove(),6500)}}

  function count(x,y){
    const k=today(),before=S.days[k]||0;S.total++;S.days[k]=before+1;tick();vib(12);
    const btn=$('tap'),r=btn.getBoundingClientRect(),sz=r.width*.35;
    const rp=document.createElement('span');rp.className='rip';
    rp.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+((x??r.left+r.width/2)-r.left-sz/2)+'px;top:'+((y??r.top+r.height/2)-r.top-sz/2)+'px';
    btn.appendChild(rp);setTimeout(()=>rp.remove(),650);
    const f=document.createElement('span');f.className='float';f.textContent='राम';f.style.left=(30+Math.random()*40)+'%';f.style.top='20%';
    btn.parentNode.appendChild(f);setTimeout(()=>f.remove(),1100);
    if(S.total%S.mala===0){bell();vib([80,60,80]);petals();toast('🙏 Mala complete! '+fmt(S.total/S.mala)+' total')}
    if(before+1===S.goal)setTimeout(()=>{bell();petals();toast('🌺 Daily goal reached. Sitaram!')},600);
    save();render();
  }
  const tapEl=$('tap'),noPhoto=()=>S.mode==='photo'&&!photo;
  tapEl.addEventListener('pointerdown',e=>{if(noPhoto())return;e.preventDefault();tapEl.classList.add('down');count(e.clientX,e.clientY)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>tapEl.addEventListener(ev,()=>tapEl.classList.remove('down')));
  tapEl.addEventListener('click',()=>{if(noPhoto())$('file').click()});
  document.addEventListener('keydown',e=>{
    if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||noPhoto())return;
    if((e.code==='Space'||e.code==='Enter')&&!e.repeat&&!document.activeElement.classList.contains('chip')){e.preventDefault();tapEl.classList.add('down');count()}});
  document.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter')tapEl.classList.remove('down')});

  // photo upload (cropped to a square, shrunk, saved on device)
  $('chg').onclick=()=>$('file').click();
  $('rmv').onclick=()=>{photo=null;try{localStorage.removeItem(PK)}catch(e){}build();toast('Photo removed')};
  $('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=Math.min(640,s);
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,c.width,c.height);
      photo=c.toDataURL('image/jpeg',.82);try{localStorage.setItem(PK,photo)}catch(x){toast('Photo works now but is too big to save')}
      if(S.mode!=='photo'){setMode('photo')}else build();toast('Photo set. Tap it to count!')};
      im.onerror=()=>toast('Could not read that image');im.src=fr.result};
    fr.readAsDataURL(f);e.target.value=''};

  function undo(){const k=today();if(S.total>0&&(S.days[k]||0)>0){S.total--;S.days[k]--;save();render();toast('Removed one count')}}
  $('undo').onclick=undo;
  $('reset').onclick=()=>{const k=today(),t=S.days[k]||0;if(!t)return toast('Nothing to reset today');
    if(confirm('Reset today\'s '+fmt(t)+' counts? All-time total will reduce too.')){S.total=Math.max(0,S.total-t);S.days[k]=0;save();render()}};
  $('wipe').onclick=()=>{if(confirm('Erase ALL saved jap history on this device?')){S.total=0;S.days={};save();render();toast('All data erased')}};

  let timer=null;
  function setAuto(on){clearInterval(timer);timer=null;const b=$('auto');
    if(on&&!noPhoto()){timer=setInterval(()=>count(),S.speed);b.textContent='⏸ Stop';b.classList.add('on')}
    else{b.textContent='▶ Auto Jap';b.classList.remove('on');if(on)toast('Add a photo first')}}
  $('auto').onclick=()=>setAuto(!timer);

  $('setBtn').onclick=()=>$('panel').classList.toggle('open');
  $('malaSel').value=S.mala;$('goalIn').value=S.goal;$('speedSel').value=S.speed;
  $('malaSel').onchange=e=>{S.mala=+e.target.value;save();beads();render()};
  $('goalIn').onchange=e=>{S.goal=Math.max(1,parseInt(e.target.value)||1008);e.target.value=S.goal;save();render()};
  $('speedSel').onchange=e=>{S.speed=+e.target.value;save();if(timer)setAuto(true)};
  function sw(id,key){const b=$(id);b.setAttribute('aria-checked',S[key]);b.onclick=()=>{S[key]=!S[key];b.setAttribute('aria-checked',S[key]);save();if(S[key]&&key==='sound')tick()}}
  sw('swSound','sound');sw('swVib','vib');
  let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{beads();render()},150)});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
  setMode(S.mode);
})();
</script>
</body>
</html>
